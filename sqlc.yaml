# sqlc renders a querier per domain package, from that package's own .sql files
# against the whole of Fijo's DDL.
#
# The schema it reads is internal/database/migrations/migration_files, which is
# Fijo's half of the sequence. The platform's half is rendered at runtime from
# platform-go and is not a file, so sqlc cannot see identity_users and a query
# here cannot join one — the same boundary DDB's repositories work inside, and
# the same one the tier rule already draws.
#
# emit_methods_with_db_argument is what makes the platform's store convention
# expressible: a generated method takes the executor as an argument, so a write
# is handed a Tx and a read is handed a reader, and neither is decided by the
# querier.
version: "2"

sql:
  - engine: "postgresql"
    schema: "internal/database/migrations/migration_files"
    queries:
      - "internal/domain/owners/sqlc_queries"
    strict_function_checks: true
    gen:
      go: &gen
        package: "generated"
        out: "internal/domain/owners/generated"
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        emit_exported_queries: false
        emit_json_tags: false
        emit_params_struct_pointers: true
        emit_result_struct_pointers: true
        emit_methods_with_db_argument: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        output_batch_file_name: "batch_generated.go"
        output_db_file_name: "db_generated.go"
        output_models_file_name: "models_generated.go"
        output_querier_file_name: "querier_generated.go"
        output_files_suffix: "_generated"
        query_parameter_limit: 1
        rename:
          url: "URL"
          ids: "IDs"
        overrides:
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
