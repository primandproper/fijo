---
on:
  pull_request:
    paths:
      - '**/*.go'
      - config/**
      - internal/config/envvars/**
      - proto/**
      - frontend/packages/api-client/src/generated/**
      - go.mod
      - go.sum

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: generated files
jobs:
  configs:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Render configs
        run: make configs

      - name: Fail if the rendered configs are out of date
        run: git diff --exit-code -- config/

  envvars:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Generate environment variable constants
        run: make envvars

      - name: Fail if the generated environment variable constants are out of date
        run: git diff --exit-code -- internal/config/envvars/

  proto:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # protoc is pinned to the version scripts/proto.sh requires, because its
      # version is written into every generated header. The Go plugins are the
      # versions go.mod pins as tools and the script builds them itself.
      - name: Install protoc
        run: |
          curl -sSL -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v33.1/protoc-33.1-linux-x86_64.zip
          sudo unzip -q -o protoc.zip -d /usr/local
          protoc --version

      - name: Install the TypeScript plugin
        run: |
          npm install -g npm@11
          (cd frontend && npm ci)

      - name: Download modules
        run: go mod download

      - name: Regenerate the bindings
        run: make proto

      - name: Fail if the generated bindings are out of date
        run: git diff --exit-code -- internal/grpc/fijopb/ frontend/packages/api-client/src/generated/
